<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- wechat-mp-skill logo: WeChat-green rounded tile, white chat bubble, terminal cursor -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07C160"/>
      <stop offset="1" stop-color="#059A4A"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <!-- chat bubble -->
  <path d="M256 108c-84 0-152 56-152 126 0 40 23 76 59 99l-13 45c-2 8 6 14 13 10l52-29c13 3 27 5 41 5 84 0 152-56 152-130s-68-126-152-126z" fill="#ffffff"/>
  <!-- eyes -->
  <circle cx="212" cy="222" r="16" fill="#07C160"/>
  <circle cx="300" cy="222" r="16" fill="#07C160"/>
  <!-- terminal prompt inside bubble -->
  <path d="M212 268l-30 26 30 26" fill="none" stroke="#07C160" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="228" y="306" width="66" height="14" rx="7" fill="#07C160"/>
  <!-- API braces badge -->
  <text x="256" y="452" font-family="Menlo, Consolas, monospace" font-size="64" font-weight="bold" fill="#ffffff" text-anchor="middle">{api}</text>
</svg>
